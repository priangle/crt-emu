; ------------------------------------------------------------------
; cnc-ddraw (crt-emu build) + the crt-emu 2 shader for HoMM3 HD (HotA)
; This file replaces ddraw.ini completely: anything not listed here
; cnc-ddraw takes from its defaults.
; Comments only on lines of their own.
; ------------------------------------------------------------------

[ddraw]
renderer=opengl
; two passes: the .glsl file and the .glsl.pass1 next to it (settings are in the second)
shader=Shaders\crt-emu\crt-emu-pass1scale.glsl
; if you get a black screen instead of the picture, use the single-pass version:
;shader=Shaders\crt-emu\crt-emu-lite.glsl

; borderless full-screen window (more reliable than exclusive full screen)
windowed=true
fullscreen=true
border=false
; a normal framed window: fullscreen=false, border=true and, for example,
; width=3200 and height=2400 (800x600 exactly 4x)
maintas=true
; integer scale: the largest whole multiplier, the rest is a black border.
; On 5120x2880: 960x720 -> 4x at full height, 800x600 -> 4x with a border,
; 1280x720 -> 4x full screen, 1024x768 -> only 3x.
; boxing=false stretches to the full height with a fractional multiplier
boxing=true
resizable=true
vsync=true
; 60 frames with forced redraw: menus and videos do not stay black
maxfps=60
minfps=-2
adjmouse=true
; do not confine the cursor: without this, mouse clicks do not reach the game
devmode=true
nonexclusive=true
; do not hook DirectInput: otherwise cnc-ddraw clears mouse buttons when it thinks the window is inactive
no_dinput_hook=true
; crt-emu build: do not let the HD mod switch the game window to "DPI unaware"
; (otherwise with Windows scaling above 100% every other pixel is dropped - the
; mask turns green - and the mouse reaches only part of the screen)
fix_dpi_unaware=true
; crt-emu build: shader on/off key - without the shader the frame is drawn
; as plain square pixels. F11 = 0x7A, F12 = 0x7B, F10 = 0x79,
; Scroll Lock = 0x91, Pause = 0x13; 0 disables the key
keytoggleshader=0x7A
; crt-emu build: shader tuning panel over the game, live editing
; (F12 = 0x7B; 0 disables it). Works with renderer=opengl
keyosd=0x7B
; do not rewrite this file on exit
savesettings=0

; section for a specific exe (file name without .exe)
[h3hota HD]
renderer=opengl
shader=Shaders\crt-emu\crt-emu-pass1scale.glsl
game_handles_close=true
; F4 switches between window and full screen
keytogglefullscreen2=0x73
